<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DanaKita - Dana acara yang terang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap">
<style>
:root{--bg:#EDF2EF;--pa:#fff;--ink:#0D2B2B;--mut:#52666A;--line:#D3DEDA;--g:#0B7A62;--b:#3B5BFF;--o:#D9442A;--y:#F2B632;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1819;--pa:#112628;--ink:#E9F2EF;--mut:#9DB5B0;--line:#214044;--g:#2FD1AC;--b:#7C93FF;--o:#FF7C62;--on:#0A1819}}
:root[data-theme="dark"]{--bg:#0A1819;--pa:#112628;--ink:#E9F2EF;--mut:#9DB5B0;--line:#214044;--g:#2FD1AC;--b:#7C93FF;--o:#FF7C62;--on:#0A1819}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.shell{display:grid;min-height:100vh}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--pa);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-width:64px;min-height:48px;border:0;border-radius:12px;background:transparent;color:var(--mut);font:700 12px Figtree,sans-serif;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
.brand{display:none}
main{padding:18px 16px 110px;max-width:860px;width:100%;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:26px}
.role{display:flex;background:var(--pa);border:1px solid var(--line);border-radius:99px;padding:3px}
.role button{min-height:38px;border:0;border-radius:99px;padding:0 14px;background:transparent;color:var(--mut);font:700 13px Figtree,sans-serif;cursor:pointer}
.role button.on{background:var(--g);color:var(--on)}
.card{background:var(--pa);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:var(--ink);color:var(--bg);border:0;padding:22px}
.hero .big{font-size:clamp(40px,11vw,68px);font-weight:800;line-height:1;margin:6px 0}
.hero small{color:var(--bg);opacity:.75}
.flow{display:flex;height:22px;border-radius:99px;overflow:hidden;margin:16px 0 10px;background:rgba(255,255,255,.18)}
.flow i{display:block;height:100%;min-width:3px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--pa);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{font:800 22px 'Bricolage Grotesque',sans-serif;display:block}
.stat span{color:var(--mut);font-size:13px}
h2{font-size:22px;margin:22px 0 10px}
.sub{color:var(--mut);margin:-6px 0 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row p{margin:0;font-size:14px;color:var(--mut)}
.tag{display:inline-block;font:700 12px Figtree,sans-serif;border-radius:99px;padding:2px 10px;background:var(--g);color:var(--on);white-space:nowrap}
.tag.w{background:var(--y);color:#0D2B2B}.tag.r{background:var(--o);color:#fff}.tag.b{background:var(--b);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--g)}
.bar.hot i{background:var(--o)}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;background:var(--ink);color:var(--bg);font:700 14px Figtree,sans-serif;cursor:pointer}
.btn.g{background:var(--g);color:var(--on)}.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);color:var(--ink);font:16px Figtree,sans-serif;width:160px}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;font:14px/1.55 Figtree,sans-serif;margin:10px 0 0}
.log{background:#0A1819;color:#7BE9CF;border-radius:12px;padding:12px;font:13px ui-monospace,monospace;white-space:pre-wrap;margin-top:10px}
.lem{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.lem button{min-height:96px;text-align:left;border:1px solid var(--line);background:var(--pa);color:var(--ink);border-radius:16px;padding:14px;font:700 18px "Bricolage Grotesque",sans-serif;cursor:pointer}.lem button small{display:block;font:400 13px Figtree,sans-serif;color:var(--mut);margin-top:4px}.lem button:hover{border-color:var(--g)}.login{max-width:520px;margin:0 auto;padding:40px 16px}.login .big{font-size:48px;font-weight:800}.err{color:var(--o);font-weight:700;font-size:14px}.in{width:100%;margin-bottom:8px}.th{width:44px;height:44px;border-radius:8px;object-fit:cover;vertical-align:middle;margin-right:8px}.pv{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:10px 0}.ban{background:var(--y);color:#0D2B2B;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;margin-bottom:12px}.sc{font:800 24px 'Bricolage Grotesque',sans-serif}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
@media (min-width:820px){
.shell{grid-template-columns:230px 1fr}
nav{position:sticky;top:0;height:100vh;flex-direction:column;border:0;border-right:1px solid var(--line);padding:24px 14px;overflow:visible;align-self:start}
nav button{flex:0 0 auto;text-align:left;padding:0 14px;font-size:15px;min-height:46px}
.brand{display:block;font:800 26px 'Bricolage Grotesque',sans-serif;margin:0 0 18px 8px}
.brand small{display:block;font:400 12px Figtree,sans-serif;color:var(--mut)}
main{padding-bottom:40px}
}
</style>
</head>
<body>
<div id="root"></div>
<script>
const rp=n=>'Rp'+new Intl.NumberFormat('id-ID').format(Math.round(n));
const COL=['#0B7A62','#3B5BFF','#F2B632','#E8553A','#8A5CF6','#14A3C7'];
const LEM={hima:{nama:'HIMA Teknik Elektro',ac:'Techno Day 2026',tema:'teknologi',m:.6,sc:[90,84,52,60]},bem:{nama:'BEM Fakultas Teknik',ac:'Eco Fest 2026',tema:'lingkungan',m:1,sc:[92,66,61,58]},dpm:{nama:'DPM Fakultas Teknik',ac:'Forum Aspirasi Mahasiswa',tema:'pendidikan',m:.5,sc:[55,66,62,80]},club:{nama:'Studi Club Robotika',ac:'Workshop Robotika 2026',tema:'teknologi',m:.4,sc:[50,80,91,55]}};
const CO=[['Perusahaan A','Produk ramah lingkungan','halaman CSR'],['Perusahaan E','Layanan keuangan digital','kontak kemitraan'],['Perusahaan B','Teknologi umum','halaman kemitraan'],['Perusahaan D','Penerbit dan edukasi','program CSR']];
const reason=(sc,t)=>sc>=80?`Tema ${t} selaras langsung dengan fokus perusahaan.`:sc>=60?`Ada irisan dengan tema ${t}, perlu diverifikasi.`:`Kecocokan tema rendah, tetapi bisa menjangkau mahasiswa.`;
function mk(k){const L=LEM[k],m=L.m;return{pos:[['Konsumsi',4e6],['Perlengkapan',3.5e6],['Transport',2e6],['Publikasi',1.5e6],['Dokumentasi',1e6],['Lain-lain',1e6]].map(([k,a])=>({k,a:a*m})),inc:[{t:'Kas organisasi',n:5e6*m,d:'2 Okt'},{t:'Iuran pengurus',n:2e6*m,d:'4 Okt'}],exp:[{t:'Konsumsi rapat pengurus',pos:'Konsumsi',n:350000*m,st:'ok',d:'5 Okt'},{t:'Cetak poster A3',pos:'Publikasi',n:450000*m,st:'ok',d:'6 Okt'},{t:'Sewa sound system',pos:'Perlengkapan',n:1200000*m,st:'ok',d:'8 Okt'}],sp:CO.map((c,i)=>({n:c[0],s:c[1],src:c[2],sc:L.sc[i]})).sort((a,b)=>b.sc-a.sc),props:[],notas:[['Katering nasi box 50 porsi',1850000*m],['Cetak banner 3x4 m dan spanduk',2200000*m],['Sewa sound system',1200000*m]]};}
const S={step:'lembaga',l:null,auth:null,role:'pengurus',view:'ringkasan',d:null,err:'',form:null,dealing:null,mail:null,photo:null,nf:null,nota:null,log:'',ni:0};
const D=()=>S.d,L=()=>LEM[S.l],reg=()=>S.auth==='terdaftar',isB=()=>reg()&&S.role==='bendahara';
const used=k=>D().exp.filter(e=>e.pos===k&&e.st==='ok').reduce((s,e)=>s+e.n,0);
const tIn=()=>D().inc.reduce((s,e)=>s+e.n,0),tOut=()=>D().exp.filter(e=>e.st==='ok').reduce((s,e)=>s+e.n,0);
const ALL=[['ringkasan','Ringkasan'],['sponsor','Sponsor'],['proposal','Proposal'],['masuk','Dana masuk'],['anggaran','Anggaran'],['nota','Nota'],['laporan','Laporan']];
const PUB=['ringkasan','masuk','anggaran','laporan'];
const TITLE={ringkasan:'Ke mana uang kita pergi',sponsor:'Cari sponsor',proposal:'Proposal ke perusahaan',masuk:'Dana masuk',anggaran:'Anggaran per pos',nota:'Catat pengeluaran',laporan:'Laporan pertanggungjawaban'};
const tag=st=>st==='ok'?'<span class="tag">Disetujui</span>':'<span class="tag w">Perlu dicek</span>';
const list=(a,f)=>a.length?a.map(f).join(''):'<p class="sub">Belum ada data.</p>';
const th=e=>e.img?`<img class="th" src="${e.img}" alt="Foto nota">`:'';
function V_ringkasan(){const out=tOut(),sisa=tIn()-out;const seg=D().pos.map((p,i)=>({k:p.k,u:used(p.k),c:COL[i]})).filter(x=>x.u>0);
return `<div class="card hero"><small>Sisa dana ${L().ac}</small><div class="big">${rp(sisa)}</div><small>${rp(tIn())} masuk, ${rp(out)} sudah dipakai</small><div class="flow">${seg.map(x=>`<i style="width:${x.u/out*100}%;background:${x.c}" title="${x.k}"></i>`).join('')}</div><div class="leg">${seg.map(x=>`<span style="--c:${x.c}">${x.k} ${rp(x.u)}</span>`).join('')}</div></div>
<div class="grid3"><div class="stat"><b>${rp(tIn())}</b><span>Dana masuk</span></div><div class="stat"><b>${rp(out)}</b><span>Terpakai (disetujui)</span></div><div class="stat"><b>${D().exp.filter(e=>e.st!=='ok').length}</b><span>Menunggu bendahara</span></div></div>
<h2>Semua pengeluaran</h2><div class="card">${list([...D().exp].reverse(),e=>`<div class="row"><div>${th(e)}<b>${e.t}</b><p>${e.pos}, ${e.d}${e.fl?'. '+e.fl:''}</p></div><div style="text-align:right"><b>${rp(e.n)}</b><br>${tag(e.st)}</div></div>`)}</div>`;}
function V_sponsor(){return `<p class="sub">RPA mengumpulkan kontak publik, AI meranking. Pengurus yang memutuskan.</p>`+D().sp.map(c=>{const p=D().props.find(x=>x.to===c.n);return `<div class="card"><div class="row" style="border:0;padding:0"><div><b>${c.n}</b><p>${c.s}</p></div><span class="sc">${c.sc}</span></div><div class="bar"><i style="width:${c.sc}%;background:var(--b)"></i></div><p style="margin:0;font-size:14px"><b>Alasan AI:</b> ${reason(c.sc,L().tema)} <span style="color:var(--mut)">Sumber: ${c.src}.</span></p>
${p?`<div class="acts"><span class="tag b">Proposal: ${PS[p.st]}</span></div>`:`<div class="acts"><button class="btn o" data-a="mail" data-i="${c.n}">Lihat draf email</button><button class="btn g" data-a="form" data-i="${c.n}">Ajukan proposal</button></div>`}
${S.form===c.n?`<div class="card" style="margin:10px 0 0"><b>Proposal untuk ${c.n}</b><p class="sub" style="margin:4px 0 8px">Lampirkan file proposal (PDF) dan isi nominal yang diminta.</p><input class="in" id="pn" inputmode="numeric" value="${Math.round(5e6*L().m)}" aria-label="Nominal"><input class="in" type="file" id="pf" accept=".pdf,application/pdf" aria-label="File proposal"><div class="acts"><button class="btn g" data-a="submitp" data-i="${c.n}">Ajukan ke bendahara</button></div></div>`:''}
${S.mail===c.n?`<pre>Subjek: Kolaborasi sponsorship ${L().ac}\n\nYth. Tim CSR ${c.n},\n\nKami dari ${L().nama} akan menyelenggarakan ${L().ac}. ${reason(c.sc,L().tema)}\n\nKami menawarkan logo di poster dan media sosial, booth, dan sesi presentasi singkat. Bolehkah kami menjadwalkan pertemuan singkat?\n\nSalam,\n${L().nama}</pre>`:''}</div>`}).join('');}
const PS={pending:'menunggu persetujuan',sent:'terkirim',tertarik:'perusahaan tertarik',tolak:'ditolak, follow-up dihentikan',deal:'deal'};
function V_proposal(){return `<p class="sub">Proposal disetujui bendahara dulu sebelum terkirim ke perusahaan.</p>`+list([...D().props].reverse(),(p,)=>{const i=D().props.indexOf(p);return `<div class="card"><div class="row" style="border:0;padding:0"><div><b>${p.to}</b><p>${rp(p.n)}, file: ${p.f}</p></div><span class="tag ${p.st==='pending'?'w':p.st==='tolak'?'r':'b'}">${PS[p.st]}</span></div>
${p.st==='pending'?(isB()?`<div class="acts"><button class="btn g" data-a="psend" data-i="${i}">Setujui dan kirim</button><button class="btn o" data-a="pdel" data-i="${i}">Tolak</button></div>`:'<p class="sub" style="margin:8px 0 0">Ganti ke Bendahara untuk menyetujui.</p>'):''}
${p.st==='sent'?`<div class="acts"><button class="btn o" data-a="prep" data-i="${i}|tertarik">Simulasi: tertarik</button><button class="btn o" data-a="prep" data-i="${i}|tolak">Simulasi: menolak</button></div>`:''}
${p.st==='tertarik'?(S.dealing===i?`<div class="acts"><input id="amt" inputmode="numeric" value="${p.n}" aria-label="Nominal deal"><button class="btn g" data-a="dealok" data-i="${i}">Catat sebagai dana masuk</button></div>`:`<div class="acts"><button class="btn g" data-a="deal" data-i="${i}">Tandai deal</button></div>`):''}</div>`});}
function V_masuk(){return `<div class="card">${list([...D().inc].reverse(),e=>`<div class="row"><div><b>${e.t}</b><p>${e.d}</p></div><b style="color:var(--g)">+ ${rp(e.n)}</b></div>`)}</div><div class="stat"><b>${rp(tIn())}</b><span>Total dana masuk. Sponsor yang deal otomatis tercatat di sini.</span></div>`;}
function V_anggaran(){return D().pos.map((p,i)=>{const u=used(p.k),pc=Math.min(100,u/p.a*100);return `<div class="card"><div class="row" style="border:0;padding:0"><b><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${COL[i]};margin-right:8px"></span>${p.k}</b><span>${rp(u)} dari ${rp(p.a)}</span></div><div class="bar ${pc>85?'hot':''}"><i style="width:${pc}%"></i></div><p style="margin:0;font-size:13px;color:var(--mut)">Sisa ${rp(p.a-u)}</p></div>`}).join('');}
function classify(t){const l=t.toLowerCase();return /katering|nasi|konsumsi|snack/.test(l)?'Konsumsi':/banner|cetak|poster|spanduk/.test(l)?'Publikasi':/sound|sewa|alat|tenda/.test(l)?'Perlengkapan':/bensin|transport|ojek/.test(l)?'Transport':'Lain-lain';}
function analyze(t,n){const pos=classify(t),p=D().pos.find(x=>x.k===pos),fl=[];if(used(pos)+n>p.a)fl.push(`Melebihi anggaran ${pos}: sisa ${rp(p.a-used(pos))}, nota ${rp(n)}`);if(D().exp.some(e=>e.pos===pos&&Math.round(e.n)===Math.round(n)))fl.push('Mirip dengan catatan yang sudah ada (kemungkinan nota ganda)');return{t,n,pos,fl:fl.join('. ')};}
function V_nota(){const pend=D().exp.map((e,i)=>({...e,i})).filter(e=>e.st!=='ok');
return `<p class="sub">Masukkan foto nota, RPA membaca, AI memilih pos dan menandai yang janggal. Bendahara yang menyetujui.</p>
<div class="card"><b>1. Masukkan foto nota</b><p class="sub" style="margin:4px 0 8px">Untuk demo, foto apa saja boleh.</p><input class="in" type="file" id="nf" accept="image/*" aria-label="Foto nota">
${S.photo?`<img class="pv" src="${S.photo}" alt="Foto nota yang dipilih"><b>2. Cek hasil bacaan RPA (simulasi, bisa diedit)</b><div style="margin-top:8px"><input class="in" id="nt" value="${S.nf.t}" aria-label="Keterangan"><input class="in" id="nn" inputmode="numeric" value="${Math.round(S.nf.n)}" aria-label="Nominal"></div><div class="acts"><button class="btn" data-a="scan">Analisis dengan AI</button></div>`:''}
${S.log?`<div class="log">${S.log}</div>`:''}
${S.nota?`<div style="margin-top:12px"><b>Hasil:</b> ${S.nota.t}, ${rp(S.nota.n)}<br><b>Saran pos:</b> <span class="tag b">${S.nota.pos}</span>${S.nota.fl?`<p style="margin:8px 0 0"><span class="tag r">Perlu dicek</span> ${S.nota.fl}.</p>`:'<p style="margin:8px 0 0"><span class="tag">Wajar</span> Sesuai anggaran, tidak ada kejanggalan.</p>'}<div class="acts"><button class="btn g" data-a="send">Kirim ke bendahara</button></div></div>`:''}</div>
<h2>Menunggu persetujuan</h2><div class="card">${list(pend,e=>`<div class="row"><div>${th(e)}<b>${e.t}</b><p>${e.pos}, ${rp(e.n)}${e.fl?'. '+e.fl:''}</p></div>${isB()?`<div class="acts" style="margin:0"><button class="btn g" data-a="ok" data-i="${e.i}">Setujui</button><button class="btn o" data-a="no" data-i="${e.i}">Tolak</button></div>`:'<span class="tag w">Menunggu bendahara</span>'}</div>`)}</div>${!isB()?'<p class="sub">Ganti ke Bendahara (kanan atas) untuk menyetujui.</p>':''}`;}
function V_laporan(){const t=`LAPORAN PERTANGGUNGJAWABAN\n${L().ac}, ${L().nama}\n\nDana masuk: ${rp(tIn())}\n${D().inc.map(e=>'- '+e.t+': '+rp(e.n)).join('\n')}\n\nPengeluaran disetujui: ${rp(tOut())}\n${D().pos.map(p=>'- '+p.k+': '+rp(used(p.k))+' dari '+rp(p.a)).join('\n')}\n\nSisa dana: ${rp(tIn()-tOut())}\nPengeluaran menunggu persetujuan: ${D().exp.filter(e=>e.st!=='ok').length}`;return `<p class="sub">Dibuat otomatis dari data yang tercatat dan disetujui.</p><div class="card"><pre>${t}</pre><div class="acts"><button class="btn g" data-a="copy">Salin laporan</button></div></div>`;}
const V={ringkasan:V_ringkasan,sponsor:V_sponsor,proposal:V_proposal,masuk:V_masuk,anggaran:V_anggaran,nota:V_nota,laporan:V_laporan};
function login(){
 if(S.step==='lembaga')return `<div class="login"><div class="big">DanaKita</div><p class="sub">Dana acara yang terang. Pilih lembaga untuk melanjutkan.</p><div class="lem">${Object.entries(LEM).map(([k,v])=>`<button data-a="pick" data-i="${k}">${v.nama.split(' ')[0]==='Studi'?'Studi Club':v.nama.split(' ')[0]}<small>${v.nama}</small></button>`).join('')}</div></div>`;
 return `<div class="login"><div class="big">${L().nama}</div><p class="sub">${L().ac}. Pilih cara masuk.</p>
 <div class="card"><h3>Masuk sebagai umum</h3><p class="sub" style="margin:4px 0 0">Hanya melihat: ringkasan dana, anggaran, dan laporan.</p><div class="acts"><button class="btn o" data-a="umum">Lihat sebagai umum</button></div></div>
 <div class="card"><h3>Masuk sebagai pengurus terdaftar</h3><p class="sub" style="margin:4px 0 8px">Bisa mencatat nota, mengajukan proposal, dan mengelola dana. Akun demo sudah terisi, kata sandi demo123.</p><input class="in" id="em" value="pengurus@${S.l}.kampus.ac.id" aria-label="Email"><input class="in" id="pw" type="password" value="demo123" aria-label="Kata sandi">${S.err?`<p class="err">${S.err}</p>`:''}<div class="acts"><button class="btn g" data-a="masuk">Masuk</button></div></div>
 <button class="btn o" data-a="back">Ganti lembaga</button></div>`;}
function app(){const views=reg()?ALL:ALL.filter(x=>PUB.includes(x[0]));if(!views.some(x=>x[0]===S.view))S.view='ringkasan';
 return `<div class="shell"><nav>${'<div class="brand">DanaKita<small>'+L().nama+'</small></div>'}${views.map(([k,l])=>`<button data-a="go" data-i="${k}" class="${S.view===k?'on':''}">${l}</button>`).join('')}</nav><main>
 <div class="top"><h1>${TITLE[S.view]}</h1><div class="acts" style="margin:0">${reg()?`<div class="role" role="group" aria-label="Peran"><button data-a="role" data-i="pengurus" class="${S.role==='pengurus'?'on':''}">Pengurus</button><button data-a="role" data-i="bendahara" class="${S.role==='bendahara'?'on':''}">Bendahara</button></div>`:''}<button class="btn o" data-a="out">Keluar</button></div></div>
 ${reg()?'':'<div class="ban">Mode umum: hanya bisa melihat. Masuk sebagai pengurus untuk mengelola.</div>'}${V[S.view]()}<p class="sub" style="margin-top:24px;font-size:13px">Prototipe demo dengan data contoh. Nama perusahaan bersifat ilustrasi.</p></main></div>`;}
const R=document.getElementById('root');
function render(){R.innerHTML=S.step==='app'?app():login();}
document.addEventListener('change',e=>{if(e.target.id==='nf'&&e.target.files[0]){const f=e.target.files[0],r=new FileReader();r.onload=()=>{S.photo=r.result;const x=D().notas[S.ni++%3];S.nf={t:x[0],n:x[1]};S.nota=null;S.log='';render();};r.readAsDataURL(f);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
 if(a==='pick'){S.l=i;S.d=mk(i);S.step='akses';S.err='';}
 else if(a==='back'){S.step='lembaga';}
 else if(a==='umum'){S.auth='umum';S.step='app';S.view='ringkasan';}
 else if(a==='masuk'){if(document.getElementById('pw').value==='demo123'&&document.getElementById('em').value.trim()){S.auth='terdaftar';S.role='pengurus';S.step='app';S.view='ringkasan';S.err='';}else S.err='Email atau kata sandi salah. Untuk demo, kata sandinya demo123.';}
 else if(a==='out'){S.step='lembaga';S.auth=null;S.photo=null;S.nota=null;S.log='';S.form=null;}
 else if(a==='go'){S.view=i;window.scrollTo(0,0);}
 else if(a==='role')S.role=i;
 else if(a==='mail')S.mail=S.mail===i?null:i;
 else if(a==='form')S.form=i;
 else if(a==='submitp'){const v=parseInt(String(document.getElementById('pn').value).replace(/\D/g,''))||0;const f=document.getElementById('pf').files[0];if(!v)return;D().props.push({to:i,n:v,f:f?f.name:'proposal.pdf (contoh)',st:'pending'});S.form=null;}
 else if(a==='psend')D().props[+i].st='sent';
 else if(a==='pdel')D().props.splice(+i,1);
 else if(a==='prep'){const[x,r]=i.split('|');D().props[+x].st=r;}
 else if(a==='deal')S.dealing=+i;
 else if(a==='dealok'){const v=parseInt(String(document.getElementById('amt').value).replace(/\D/g,''))||0;if(!v)return;const p=D().props[+i];p.st='deal';D().inc.push({t:'Sponsor '+p.to,n:v,d:'Hari ini'});S.dealing=null;}
 else if(a==='scan'){const t=document.getElementById('nt').value.trim()||'Nota',n=parseInt(String(document.getElementById('nn').value).replace(/\D/g,''))||0;S.nota=null;S.log='[RPA] Membaca foto nota...\n';render();setTimeout(()=>{S.log+='[RPA] Teks terbaca: '+t+', '+rp(n)+'\n';render();},500);setTimeout(()=>{S.log+='[AI] Mencocokkan pos anggaran dan memeriksa kejanggalan...\n';render();},1000);setTimeout(()=>{S.nota=analyze(t,n);S.log+='[AI] Selesai. Menunggu keputusan manusia.';render();},1500);return;}
 else if(a==='send'&&S.nota){D().exp.push({t:S.nota.t,pos:S.nota.pos,n:S.nota.n,st:'pending',d:'Hari ini',fl:S.nota.fl,img:S.photo});S.nota=null;S.photo=null;S.log='';}
 else if(a==='ok')D().exp[+i].st='ok';
 else if(a==='no')D().exp.splice(+i,1);
 else if(a==='copy'){try{navigator.clipboard.writeText(document.querySelector('pre').textContent);b.textContent='Tersalin';}catch(x){b.textContent='Salin manual dari kotak';}return;}
 render();});
render();
</script>
